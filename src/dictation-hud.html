<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBP Dictation</title>
  <style>
    :root {
      --bg: rgba(18, 18, 22, 0.94);
      --bg-card: rgba(28, 28, 34, 0.9);
      --text: #f5f5f7;
      --text-dim: rgba(245, 245, 247, 0.6);
      --accent: #a78bfa;
      --danger: #f87171;
      --ok: #4ade80;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .hud {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 320px;
      background: var(--bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06) inset;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
    }
    .dot.recording {
      background: var(--danger);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot.processing {
      background: var(--accent);
      animation: pulse 0.8s ease-in-out infinite;
    }
    .dot.done {
      background: var(--ok);
    }
    .dot.error {
      background: var(--danger);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .status {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      font-size: 11px;
      color: var(--text-dim);
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meter {
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .bar {
      width: 4px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), var(--danger));
      transition: height 80ms cubic-bezier(0.22, 1, 0.36, 1), opacity 120ms;
      opacity: 0.85;
    }
    .meter.flat .bar {
      height: 4px !important;
      opacity: 0.5;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      -webkit-app-region: no-drag;
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .btn:hover { filter: brightness(1.1); }
    body.hidden { opacity: 0; pointer-events: none; }
    .card { transition: opacity 0.18s ease; }
  </style>
</head>
<body class="hidden">
  <div class="hud">
    <div class="card" id="card">
      <div class="row">
        <div class="dot" id="dot"></div>
        <div class="status" id="status">Listening…</div>
        <button class="btn" id="action-btn" style="display:none;">Fix</button>
      </div>
      <div class="meter" id="meter">
        <div class="bar" data-i="0"></div>
        <div class="bar" data-i="1"></div>
        <div class="bar" data-i="2"></div>
        <div class="bar" data-i="3"></div>
        <div class="bar" data-i="4"></div>
      </div>
      <div class="hint" id="hint">⌘⇧D again to stop</div>
    </div>
  </div>
  <script type="module" src="dist/dictation-hud.js"></script>
</body>
</html>
